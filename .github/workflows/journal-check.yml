name: Engineering journal checker

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  journal-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run journal checker
        id: checker
        shell: bash
        run: |
          set +e
          python checker.py ENGINEERING_JOURNAL_EXTRACT.md | tee journal-check.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create or update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_EXIT_CODE: ${{ steps.checker.outputs.exit_code }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- engineering-journal-checker -->";
            const output = fs.existsSync("journal-check.txt")
              ? fs.readFileSync("journal-check.txt", "utf8").trim()
              : "Checker did not produce output.";

            const ok = process.env.CHECK_EXIT_CODE === "0";
            const body = [
              marker,
              `## Engineering journal check ${ok ? "✅" : "❌"}`,
              "",
              "```text",
              output,
              "```"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const previous = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

     
